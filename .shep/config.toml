# Shepherd's own policy — this repo is its own first target.
#
# Engine in the plugin, policy in the repo: these scripts judge this
# codebase, so they are versioned with it.

# Lint, test, then a reading by an agent with no stake in the work. All three are
# synchronous — `agent_review` is a headless `claude -p`, so it needs no pane.
#
# A rejection from any of them goes to `fix`, which re-prompts the agent already in
# the task's pane; then the whole pipeline runs again, which is what decides whether
# the repair worked. Three rounds, and then it stops asking.
[pipeline.review]
steps        = ["lint", "test", "agent_review"]
on_fail      = "fix"
max_rounds   = 3
on_exhausted = "reject"

# An agent in a pane, in a worktree of its own. `code` returns `started` and the
# task waits; what resolves it is that agent stopping — `await` is on the step —
# and the verdict is the check it left behind.
[pipeline.implement]
steps = [{ run = "code", await = "agent_stopped" }]

[type.check]
description = "Lint, test and review this repo. No worktree, no handoff."
pipelines = ["review"]

# Hand it to an agent, review what it did, then let it rest for you. There is no
# handoff step: when the plan is spent the task rests with its pane open, and you
# take over — look at `show_diff`'s pane, then carry it on with `shep run`.
[type.feature]
description = "Hand it to an agent in its own worktree, review what it did, then it rests for you."
pipelines = ["implement", "review"]
