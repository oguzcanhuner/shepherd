[package]
name = "shepherd"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "shepherd"
path = "src/lib.rs"

[[bin]]
name = "shep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2.189"
serde_json = "1.0.151"
tempfile = "3.27.0"
